name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SmartCloudFS.zip
      - run: keytool -list -v -keystore SmartCloudFS/scfs.jks -storepass android | grep -E "SHA1|Alias"
      - run: printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > SmartCloudFS/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle -p SmartCloudFS :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: SmartCloudFS-apk, path: SmartCloudFS/app/build/outputs/apk/debug/app-debug.apk }
